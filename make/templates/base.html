{% load static %}

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <meta name="generator" content="Hugo 0.84.0">
    <title>{% block title %}ゲーム攻略サイト！！{% endblock %}</title>
    
    <!-- Bootstrap core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
   <style>
      .bd-placeholder-img {
        font-size: 1.125rem;
        text-anchor: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }

      .custom-navbar {
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
      }

      .container {
        padding-top: 50px; /* 上に50pxの余白を追加 */
      }

      /* 検索バーのスタイル*/

      .navbar .form-control {
      padding: 3px 8px;
      height: 40px;
      font-size: 14px;
      }

      /*検索ボタンのスタイル*/
      .navbar .btn {
          padding: 3px 10px;
          height: 40px;
          font-size: 14px;
          line-height: 1.2;
      }
      @media (min-width: 768px) {
        .bd-placeholder-img-lg {
          font-size: 3.5rem;
        }
      }
      #id_title{
        width: 300px;
        height: 40px;
      }
      #id_comment_1{
        width: 450px;
      }
      #id_comment_2{
        width: 450px;
      }

     .comment-text {
          white-space: pre-wrap; /* 改行を保持 */
          word-wrap: break-word;  /* 長い単語の折り返し */
      }

      main{
        padding-top: 60px;
       
      }

      /**タイトルの部分の余白や背景画像の設定**/
      .title-section{
        background-image: url('/static/img/huri-gazou.jpg');
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        padding: 60px ;
        padding-bottom: 120px;
        min-height: 300px;
        
        
      }

      /**入力欄を黒色**/
      .form-control {
        color: #000;                 /** 文字色：黒 **/
        background-color: #fff;      /** 背景色：白 **/
        border-color: #6c757d;       /** 枠線：やや濃いグレー（任意） **/
      }
      
      .form-control {
        max-width: 350px;
      }
      hr{
        background-color: #0443ff;
        height: 3px;
      }

    </style>

    <header>
      <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="{% url 'make:index' %}">情報サイト</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarCollapse">
          <ul class="navbar-nav me-auto mb-2 mb-md-0">
            {% if user.is_authenticated %}
            <!--ログイン中-->
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="{% url 'make:mypage' %}">{{user.username}}のページ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="{% url 'accounts:logout' %}">ログアウト</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="{% url 'password_reset' %}">パスワードリセット</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="{% url 'make:question' %}">お問い合わせ</a>
            </li>
            {% else %}
            <!--ログアウト状態-->
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="{% url 'accounts:signup' %}">サインアップ</a>
            </li>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="{% url 'accounts:login' %}">ログイン</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="{% url 'make:question' %}">お問い合わせ</a>
            </li>
            {% endif %}
          </ul>
            <form action="{% url 'make:search' %}" method="get">
                <input type="text" name="q" placeholder="キーワード">
                <button type="submit">検索</button>
            </form>
          </div>
        </div>
      </nav>
    </header>
    <main>
   
    {% block contents %}{% endblock %}
    </main>

    <footer class="text-muted py-5">
      <div class="container">
        <p class="float-end mb-1">
          <a href="{% url 'make:index' %}">トップに戻る</a>
        </p>
        <p class="mb-1">&copy; 本サイトはモラルを守って投稿しましょう！！</p>
      </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
  </body>
</html>
