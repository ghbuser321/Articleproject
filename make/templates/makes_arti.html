{% extends 'base.html' %}


<!--ヘッダー情報のページタイトルを設定する-->
{% block title %}Artical{% endblock %}

    {% block contents %}
    <!--Bootstrapのグリッドシステム-->
    <br>
    <div class="container">
        <!--行を配置-->
        <div class="row">
            <div class="col offset-2">
                <!--ファイルをアップロードする場合はenctype="multipart/form-dataが必要"-->
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <table>
                        <tr>
                            <th>カテゴリ</th>
                            <td>{{ form.category }}</td>
                        </tr>
                        <tr>
                            <th>タイトル</th>
                            <td>{{ form.title }}</td>
                        </tr>
                        <tr>
                            <th>コメント</th>
                            <td>{{ form.comment }}</td>
                        </tr>
                        <tr>
                            <th>画像１</th>
                            <td>{{ form.image1 }}</td>
                        </tr>
                        <tr>
                            <th>画像2</th>
                            <td>{{ form.image2 }}</td>
                        </tr>
                        <tr>
                            <th>動画</th>
                            <td>{{ form.video }}</td>
                        </tr>
                    </table>
                    <hr>
                    <button type="submit">投稿する</button>
                </form>
            </div>
        </div>
    </div>
    {% endblock %}
