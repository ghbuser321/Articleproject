{% extends 'base.html' %}

{% block title %}Search{% endblock %}

{% block contents %}
    <!--検索除け-->
    <br>
    <h4>検索結果</h4>
    {% if results %}       
        {% for post in results %}
            <p>
                タイトル:<a href="{% url 'make:makes_detail' post.pk %}">{{ post.title }}</a>
            </p>
            <p>画像:<img src="{{ post.image1.url }}" class="img-fluid" style="max-height: 90px; object-fit: cover;"><br></p>
            <P>投稿者:{{ post.user.username }}</P>
            <P>投稿日時:{{ post.posted_at }}</P>
            <hr>
        {% endfor %}
    {% elif query %}
        <P>該当する投稿がありません</P>
    {% endif %}
{% endblock %}
