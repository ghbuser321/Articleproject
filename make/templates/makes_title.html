  
  <section class="py-2 title-section text-center">
    <div class="row py-lg-2">
      <div class="col-lg-6 col-md-8 mx-auto ">
        <h1 class="fw-light ">情報一覧</h1>
        <p class="lead text-muted" >
          様々なジャンルのゲームの攻略方
          身近にある便利な情報を投稿して<br>
          みんなと共有しあおう！
        </p>
      {% if user.is_authenticated %}
          <!--ログイン中のボタン-->
          <a href="{% url 'make:make' %}" class="btn btn-secondary my-2">投稿</a>
          
          <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-link p-0">ログアウト</button>
          </form>
          {% else %}
          <!--ログイン状態ではない場合のボタン-->
          <a href="{% url 'accounts:signup' %}" class="btn btn-primary my-2">サインアップ</a>
          <a href="{% url 'accounts:login' %}" class="btn btn-secondary my-2">登録済み</a>
          {% endif %}
      </div>
    </div>
  </section>
