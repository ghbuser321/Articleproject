<!--ページネーションのアイコンを左右中央に配置-->
<ul class="pagination" style="justify-content: center">
    <!--前ページを表示するアイコンとリンクの設定
    ページネーションされたPageオブジェクトをorderby_records取得
    Page.has_previou:直前にページがある場合にTureを変えス-->
    {% if page_obj.has_previou %}
    <!--前ページが存在する場合はそのページへのリンクが設定されたアイコン[<<]を表示-->
    <li class="page-item">
        <a class="page-link" href="?page={{ page_obj.previous_page_number }}" aria-label="Previous">
            <span aria-hidden="true">&laquo;</span>
        </a>
    </li>
    {% endif %}
    <!--すべてのページについてページ番号のアイコンを表示-->
    {% for num in page_obj.paginator.page_range %}
        <!--各ページのアイコンを出力-->
        {% if page_obj.number == num %}
        <!--処理中のページ番号が引き渡されたページのページ番号と一致する場合は
        ページ番号のアイコン(アクティブ状態)を表示(リンク設定なし)-->
        <li class="page-item active">
            <span class="page-link">{{ num }}</span>
        </li>
        <!--ページ番号が引き渡されたページのページ番号と一致しない場合-->
        {% else %}
        <!--ページ番号のアイコン(アクティブ状態ではない)にリンクを設定して表示-->
        <li class="page-item">
            <a class="page-link" href="?page={{ num }}">{{ num }}</a>
        </li>
        {% endif %}
    {% endfor %}
    <!--次ページへのリンクを示すアイコンの表示-->
    {% if page_obj.has_next %}
    <!--次ページが存在する場合はリンクを設定したアイコン[>>]を表示-->
    <li class="page-item">
        <a class="page-link" href="?page={{ page_obj.next_page_number }}" aria-label="Next">
            <span aria-hidden="true">&raquo;</span>
        </a>
    </li>
    {% endif %}
</ul>
